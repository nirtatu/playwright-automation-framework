name: API Tests (live, manual only)

# Runs the API suite against the live public test site. These tests send real requests and
# CREATE AND DELETE BOOKINGS there, so the workflow has no automatic triggers: start it
# deliberately from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: read

# Only one live run at a time, and never cancel one mid-run: cancelling skips the test
# teardown that deletes the bookings the run created.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  api-tests:
    name: Type check and API tests (live site)
    runs-on: ubuntu-latest
    # Must outlast the run, or GitHub cancels it mid-teardown and leaves bookings on the site.
    # Network-bound estimate, not a strict upper bound: if every test fails at its full test and
    # cleanup-fixture budget and is retried once (CI retries: 1), and local-only phases (other
    # teardown, tracing) take about 0s:
    # 2 × (8 write tests × (30s test + 190s cleanup) + cleanup.spec × (90s with test.slow() + 190s)
    # + 3 read-only tests × 30s) = 4260s, about 71 min. Estimated on top: about 1 min of worker
    # restarts (24 failures, a few seconds each) and about 5 min for the other steps, so about
    # 77 min in total.
    timeout-minutes: 80

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser install: the api project uses only Playwright's request context.

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Workers (1), retries and reporters come from playwright.config.ts. Admin credentials
      # default to the public demo values in src/config/env.ts; no secrets are used.
      # ALLOW_LIVE_WRITES opts in to the booking write tests, for this step only. Without it, those
      # tests fail on CI (not skip), so this run cannot pass with its write tests skipped for lack
      # of the flag.
      - name: Run API tests
        run: npm run test:api
        env:
          ALLOW_LIVE_WRITES: 'true'

      - name: Upload HTML report
        id: upload-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        id: upload-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Links to the ZIP artifacts uploaded above (URLs are empty if nothing was uploaded).
      - name: Add artifact links to job summary
        if: ${{ !cancelled() }}
        env:
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          RESULTS_URL: ${{ steps.upload-results.outputs.artifact-url }}
        run: |
          {
            if [ -n "$REPORT_URL" ] || [ -n "$RESULTS_URL" ]; then echo "### Downloads"; fi
            if [ -n "$REPORT_URL" ]; then echo "- [HTML report (ZIP)]($REPORT_URL): unzip, then run \`npx playwright show-report <folder>\`"; fi
            if [ -n "$RESULTS_URL" ]; then echo "- [Test results: traces, screenshots, videos (ZIP)]($RESULTS_URL)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
