name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # "passed" only when the report scan ran and found nothing; empty or "blocked" otherwise.
    outputs:
      report_scan: ${{ steps.scan.outputs.result }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Workers (1), retries and reporters come from playwright.config.ts,
      # which switches to CI behaviour via the CI variable GitHub Actions sets.
      # Allowlist: offline unit tests, UI tests and the read-only rooms API test. The auth and booking API specs
      # create and delete bookings on the live site, so they run only in the manual
      # "API Tests (live, manual only)" workflow (api-live.yml). New API specs must be added here
      # explicitly to run on every push and pull request; new UI specs under tests/ui/ are
      # included automatically.
      - name: Run unit, UI and read-only API tests
        run: npm test -- tests/unit/ tests/ui/ tests/api/rooms.spec.ts
        env:
          # The report may be published (GitHub Pages): leave out per-step source snippets, which
          # include test source code such as the fake secrets used by the redaction unit tests.
          PLAYWRIGHT_HTML_NO_SNIPPETS: 'true'

      - name: Upload HTML report
        id: upload-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        id: upload-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Links to the ZIP artifacts uploaded above (URLs are empty if nothing was uploaded).
      - name: Add artifact links to job summary
        if: ${{ !cancelled() }}
        env:
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          RESULTS_URL: ${{ steps.upload-results.outputs.artifact-url }}
        run: |
          {
            if [ -n "$REPORT_URL" ] || [ -n "$RESULTS_URL" ]; then echo "### Downloads"; fi
            if [ -n "$REPORT_URL" ]; then echo "- [HTML report (ZIP)]($REPORT_URL): unzip, then run \`npx playwright show-report <folder>\`"; fi
            if [ -n "$RESULTS_URL" ]; then echo "- [Test results: traces, screenshots, videos (ZIP)]($RESULTS_URL)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub Pages: only reports from successful pushes to main are published, and only after the
      # content scan passes. Pull requests and failed runs never reach these steps.
      # The scan decides publication only: a blocked scan does not fail the test job (its tests
      # passed), but it records result=blocked, so neither the upload nor the deploy job runs.
      # Any non-zero exit (finding, scan error, crash, missing report) counts as blocked.
      - name: Scan report before publishing
        id: scan
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if npm run report:scan; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning title=HTML report not published::The pre-publication report scan did not pass. See this step's log (values are never printed)."
            echo "### HTML report not published: the pre-publication scan did not pass (see the scan step's log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report for GitHub Pages
        if: ${{ success() && steps.scan.outputs.result == 'passed' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/
          retention-days: 1

  deploy-report:
    name: Publish HTML report to GitHub Pages
    needs: test
    # All three are required: a successful test job, a push to main, and a passed report scan.
    if: >-
      ${{ needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.test.outputs.report_scan == 'passed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can deploy; the test job keeps the read-only token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Add report link to job summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          echo "### Latest HTML report: [$PAGE_URL]($PAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
